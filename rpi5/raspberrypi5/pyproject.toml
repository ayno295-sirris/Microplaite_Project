[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microplaite-raspberrypi5"
version = "0.1.0"
description = "Minimal Raspberry Pi 5 supervisor skeleton for the microplaite bench"
requires-python = ">=3.11"
dependencies = [
  "PySide6",
  "pyqtgraph",
  "pyserial",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
